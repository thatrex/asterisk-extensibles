;--
EXT╶╴ Extension
      ├╴ ,X╶─ Select Audio
      ╰╴ ,0╶─ Start Listening

/// CONTROLS
0╶─ Pause
*╶─ Replay
#╶─ Advance

/// DIRECTORY STRUCTURE
talk-bot
├─ general.group.txt (group config)
╰─ lenny
   ├─ 1.wav
   ├─ 2.wav
   ├─ 3.wav
   ├─ 4.wav
   ├─ 5.wav
   ├─ 6.wav
   ├─ 7L.wav (L╶─ loop)
   ├─ ...
   ├─ 15.wav
   ╰─ background.wav (optional)

/// GROUP CONFIG EXAMPLE
lenny,2
kenny,1
benny,5

/// TARGET EXAMPLES
tb,lenny,1 <- defaults to locked, starts at 1
tb,general_l,1
 │  │        ╰╴Priority
 │  ╰╴Extension (name_options)
 ╰╴Context

/// TARGET EXTENSION OPTIONS
  l - Lock the controls
  g - Indicate name is of group
s10 - Start at clip 10
--;

[globals](+)
CMDTRIM = xargs printf

[tb]
exten => _.,1,Gosub(tb-core,init,1(${EXTEN}))
[tb-ctrl] ; legacy
exten => _.,1,Gosub(tb-core,init,1(${EXTEN}))
[tb-lock] ; legacy
exten => _.,1,Gosub(tb-core,init,1(${EXTEN}_l))

[tb-core]
exten => init,1,NoOp
 same => n,Set(ARRAY(NAME,OPTIONS)=${REPLACE(ARG1,_,\,)})
 same => n,Set(ISLOCKED=${REGEX("l" ${OPTIONS})})
 same => n,Set(ISGROUP=${REGEX("g" ${OPTIONS})})
 same => n,Set(NUMSTART=${SHELL(printf "${OPTIONS}" | grep -oP ".*s\K\d+" | ${CMDTRIM})})
 same => n,Set(DIRSOUND=${ASTDATADIR}/sounds/talk-bot/${NAME})
 same => n,If($[ ${ISGROUP} ])
 same => n,  Set(ARRAY(NAME,NUMSTART)=${SHELL(shuf -n 1 ${DIRSOUND}.group.txt | ${CMDTRIM})})
 same => n,  Set(DIRSOUND=${ASTDATADIR}/sounds/talk-bot/${NAME})
 same => n,EndIf
 same => n,Set(NAMEFRIENDLY=${SHELL(printf "${NAME}" | sed -E "s/\b(.)/\u\1/g")})
 same => n,Set(NAMEFRIENDLY=${REPLACE(NAMEFRIENDLY,_-, )})
 same => n,Set(NUMLAST=${SHELL(ls -v ${DIRSOUND} | grep -oP "\d+"      | tail -1 | ${CMDTRIM})})
 same => n,Set(NUMLOOP=${SHELL(ls -v ${DIRSOUND} | grep -oP "\d+(?=L)" | head -1 | ${CMDTRIM})}) 
 same => n,GosubIf($[ !${LEN(${NUMLAST})}  ]?error,1(No clips found.))
 same => n,GosubIf($[ !${LEN(${NUMLOOP})}  ]?error,1(Loop clip not found.))
 same => n,GosubIf($[ !${LEN(${NUMSTART})} ]?set-status,1(☐  Waiting))
 same => n,If($[ !${LEN(${NUMSTART})} & !${ISLOCKED} ])
 same => n,  While($[ "${NUMSTART}" != "0" & ${LEN(${NUMSTART})} < ${LEN(${NUMLAST})} ])
 same => n,    WaitDigit($[ ${LEN(${NUMSTART})} ? 0.5 :: 1.5 ],0123456789#)
 same => n,    ExecIf($[ "${WAITDIGITSTATUS}" != "DTMF" ]?ExitWhile)
 same => n,    ExecIf($[ "${WAITDIGITRESULT}" == "#"    ]?ExitWhile)
 same => n,    Set(NUMSTART=${NUMSTART}${WAITDIGITRESULT})
 same => n,  EndWhile
 same => n,EndIf
 same => n,Set(SUBSTART=$[ "${NUMSTART}" == "0" ? listen :: talk ])
 same => n,Set(NUMSTART=$[ 0${NUMSTART} > ${NUMLAST} ? ${NUMLAST} :: 0${NUMSTART} | 1 ])
 same => n,If($[ $[ ${ISGROUP} | ${ISLOCKED} ] & ${SUBSTART} == talk ])
 same => n,  Gosub(set-status,1)
 same => n,  Wait(0.3)
 same => n,EndIf
 same => n,Set(SOUNDBG=silence)
 same => n,Gosub(${SUBSTART},1)

exten => talk,1,Goto(next,1)
exten => 0,1,Goto($[ ${ISLOCKED} ? listen :: pause ],1)
exten => *,1,Goto($[ ${ISLOCKED} ? listen :: play  ],1)
exten => #,1,Goto($[ ${ISLOCKED} ? listen :: next  ],1)

exten => next,1,NoOp
 same => n,Set(I=$[ 0${I} == ${NUMLAST} ? ${NUMLOOP} :: $[ 0${I} + $[ 0${I} ? 1 :: ${NUMSTART} ] ] ])
 same => n,Goto(play,1)
 same => n,Goto(listen,1)

exten => pause,1,NoOp
 same => n,Gosub(set-status,1(I I  Paused))
 same => n,Set(SOUNDBG=silence)
 same => n,System(test -e ${DIRSOUND}/background.*)
 same => n,ExecIf($[ ${SYSTEMSTATUS} == SUCCESS ]?Set(SOUNDBG=${NAME}/background))
 same => n,ControlPlayback(talk-bot/${SOUNDBG},,,,*#)
 same => n,GotoIf($[ ${CPLAYBACKSTATUS} == USERSTOPPED ]?${CPLAYBACKSTOPKEY},1)
 same => n,Hangup

exten => play,1,NoOp
 same => n,GotoIf($[ !0${I} ]?listen,1)
 same => n,Gosub(set-status,1(▷  Talking))
 same => n,Set(SOUND=talk-bot/${NAME}/$[ ${I} == ${NUMLOOP} ? ${I}L :: ${I} ])
 same => n,If($[ ${ISLOCKED} ])
 same => n,  Playback(${SOUND})
 same => n,  ExitIf
 same => n,Else
 same => n,  Set(CPLAYBACKSTOPKEY=)
 same => n,  ControlPlayback(${SOUND},,,,0*#)
 same => n,  GotoIf($[ "${CPLAYBACKSTOPKEY}" == "*" ]?play,1)
 same => n,  GotoIf($[ "${CPLAYBACKSTOPKEY}" == "0" ]?pause,1)
 same => n,EndIf
 same => n,Goto(listen,1)

exten => listen,1,NoOp
 same => n,Gosub(set-status,1(○  Listening))
 same => n,Set(SOUNDBG=silence)
 same => n,If($[ !!0${I} ])
 same => n,  System(test -e ${DIRSOUND}/background.*)
 same => n,  ExecIf($[ ${SYSTEMSTATUS} == SUCCESS ]?Set(SOUNDBG=${NAME}/background))
 same => n,EndIf
 same => n,BackgroundDetect(talk-bot/${SOUNDBG},1500)
 same => n,Hangup

exten => error,1,NoOp
 same => n,ExecIf($[ "${ARG1}" ]?Log(ERROR,${ARG1}))
 same => n,Playback(silence/1&an-error-has-occurred&pls-try-call-later)
 same => n,Hangup

exten => set-status,1,NoOp
 same => n,Set(STATUS=${ARG1})
 same => n,GotoIf($[ ${ISLOCKED} ]?bypass)
 same => n,Set(SEPARATOR=  •  )
 same => n,Set(TITLE=${NAMEFRIENDLY})
 same => n,Set(TITLE=${TITLE} ${IF($[ "${I}"       ]?${SEPARATOR}${I})})
 same => n,Set(TITLE=${TITLE} ${IF($[ "${STATUS}"  ]?${SEPARATOR}${STATUS})})
 same => n,Set(CONNECTEDLINE(name)=${TITLE})
 same => n,Set(CONNECTEDLINE(num)=${CALLERID(dnid)})
 same => n(bypass),NoOp
 same => n,Answer
 same => n,Return