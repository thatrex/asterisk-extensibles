;--
EXT╶╴ Extension
      ├╴ ,X╶─ Select Audio
      ╰╴ ,0╶─ NSTART Listening

/// CONTROLS
0╶─ Pause
*╶─ Replay
#╶─ Advance

/// DIRECTORY STRUCTURE
talk-bot
├─ general.group.txt (group config)
╰─ lenny
   ├─ 1.wav
   ├─ 2.wav
   ├─ 3.wav
   ├─ 4.wav
   ├─ 5.wav
   ├─ 6.wav
   ├─ 7L.wav (L╶─ loop)
   ├─ ...
   ├─ 15.wav
   ╰─ background.wav (optional)

/// GROUP CONFIG EXAMPLE
lenny,2
kenny,1
benny,5

/// TARGET EXAMPLES
tb,lenny,1 <- defaults to locked, starts at 1
tb,general_l,1
 │  │        ╰╴Priority
 │  ╰╴Extension (name#options)
 ╰╴Context

/// TARGET EXTENSION OPTIONS
  l - Locks the controls
  g - Indicates name is of a group file
s10 - NSTART at clip 10

TODO ///
  store used bots per extension as to never play bot twice in row
--;

[tb]
exten => _.,1,Gosub(tb-core,init,1(${EXTEN}))
[tb-ctrl] ; legacy
exten => _.,1,Gosub(tb-core,init,1(${EXTEN}))
[tb-lock] ; legacy
exten => _.,1,Gosub(tb-core,init,1(${EXTEN}_l))

[tb-core]
exten => init,1,NoOp
 same => n,Set(ARRAY(NAME,OPTS)=${REPLACE(ARG1,_,\,)})
 same => n,Set(DIRSOUND=${ASTDATADIR}/sounds/talk-bot/${NAME})
 same => n,Set(ISLOCKED=${REGEX("l" ${OPTS})})
 same => n,Set(ISGROUP=${REGEX("g" ${OPTS})})
 same => n,Set(NSTART=${SHELL(printf "${OPTS}" | sed -nE "s/.*s([0-9]*).*/\1/p")})
 same => n,GosubIf($[${ISGROUP}]?sub-random-from-group,1)
 same => n,Set(TITLE=${SHELL(printf "${NAME}" | sed -E "s/\b(.)/\u\1/g")})
 same => n,Set(TITLE=${REPLACE(TITLE,_-, )})
 same => n,Gosub(sub-update-title,1)
 same => n,Set(CMDPREFIX=ls ${DIRSOUND} | sort -n)
 same => n,Set(NLAST=${FILTER(0-9,${SHELL(${CMDPREFIX} | grep "^[0-9]*"  | tail -1)})})
 same => n,Set(NLOOP=${FILTER(0-9,${SHELL(${CMDPREFIX} | grep "^[0-9]*L" | head -1)})})
 same => n,GosubIf($[!${LEN(${NLAST})}]?sub-error,1(No clips found.))
 same => n,GosubIf($[!${LEN(${NLOOP})}]?sub-error,1(Loop clip not found.))
 same => n,System(test -e ${DIRSOUND}/background.*)
 same => n,Set(BGSND=${IF($["${SYSTEMSTATUS}"=="SUCCESS"]?${NAME}/background:silence)})
 same => n,GosubIf($[!${LEN(${NSTART})}&!${ISLOCKED}]?sub-select,1)
 same => n,Set(PRI=${IF($["${NSTART}"=="0"]?listen:1)})
 same => n,Set(NSTART=${IF($[0${NSTART}]?${NSTART}:1)})
 same => n,Set(NSTART=${IF($[${NSTART}>${NLAST}]?${NLAST}:${NSTART})})
 same => n,Gosub(talk,${PRI})

exten => talk,1,NoOp
 same => n,Set(I=${IF($[0${I}==0${NLAST}]?${NLOOP}:$[0${I}+${IF($[0${I}]?1:${NSTART})}])})
 same => n,Set(FILE=talk-bot/${NAME}/${I}${IF($[${I}==${NLOOP}]?L)})
 same => n,Gosub(sub-update-title,1)
 same => n(play),Gosub(sub-play-$[!${ISLOCKED}?ctrl::lock],1)
 same => n(listen),BackgroundDetect(talk-bot/${IF($[0${I}]?${BGSND}:silence)},1500)
 same => n(exit),Hangup

exten => *,1,GotoIf($[!${ISLOCKED}&0${I}]?talk,play:talk,listen)
exten => #,1,GotoIf($[!${ISLOCKED}]?talk,1:talk,listen)
exten => 0,1,ExecIf($[!${ISLOCKED}]?ControlPlayback(talk-bot/${BGSND},,,,*#):Goto(talk,listen))
 same => n,GotoIf($["${CPLAYBACKSTATUS}"=="USERSTOPPED"]?${CPLAYBACKSTOPKEY},1:talk,exit)

exten => sub-random-from-group,1,NoOp
 same => n,Set(ARRAY(NAME,NSTART)=${SHELL(shuf -n 1 ${DIRSOUND}.group.txt | xargs printf)})
 same => n,Set(DIRSOUND=${ASTDATADIR}/sounds/talk-bot/${NAME})
 same => n,Return

exten => sub-select,1,NoOp
 same => n,While($["${S}"!="0"&${LEN(${S})}<${LEN(${NLAST})}])
 same => n,  WaitDigit(${IF($[${LEN(${S})}]?0.5:1.5)},0123456789#)
 same => n,  ExecIf($["${WAITDIGITSTATUS}"!="DTMF"]?ExitWhile)
 same => n,  ExecIf($["${WAITDIGITRESULT}"=="#"   ]?ExitWhile)
 same => n,  Set(S=${S}${WAITDIGITRESULT})
 same => n,EndWhile
 same => n,Set(NSTART=${S})
 same => n,Return

exten => sub-play-lock,1,NoOp
 same => n,Playback(${FILE})
 same => n,Return

exten => sub-play-ctrl,1,NoOp
 same => n,Set(CPLAYBACKSTOPKEY=)
 same => n,ControlPlayback(${FILE},,,,0*#)
 same => n,GotoIf($["${CPLAYBACKSTOPKEY}"=="*"]?talk,play)
 same => n,GotoIf($["${CPLAYBACKSTOPKEY}"=="0"]?0,1)
 same => n,Return

exten => sub-update-title,1,NoOp
 same => n,GotoIf($[${ISLOCKED}]?e)
 same => n,Set(CONNECTEDLINE(name)=${TITLE} ${IF($[0${I}]?  •  ${I})})
 same => n,Set(CONNECTEDLINE(num)=${CALLERID(dnid)})
 same => n,Answer
 same => n(e),Return

exten => sub-error,1,NoOp
 same => n,ExecIf($["${ARG1}"]?Verbose(${ARG1}))
 same => n,Playback(silence/1&an-error-has-occurred&pls-try-call-later)
 same => n,Hangup